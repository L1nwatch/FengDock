name: Generate Exercise Audio

on:
  workflow_dispatch: {}

concurrency:
  group: exercise-audio-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate English exercise cues
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_exercise_audio.py

      - name: Commit generated audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/exercises/audio
          if git diff --cached --quiet; then
            echo "Audio pack is already up to date."
            exit 0
          fi
          git commit -m "Generate English exercise audio"
          git push origin HEAD:main

      - name: Upload audio pack
        uses: actions/upload-artifact@v4
        with:
          name: exercise-audio
          path: |
            static/exercises/audio/*.mp3
            static/exercises/audio/manifest.json
